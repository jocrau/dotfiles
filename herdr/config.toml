onboarding = false

[ui]
status_indicators = "dots"
# Open new tabs immediately with a generated name; rename later (prefix+shift+t)
prompt_new_tab_name = false
# Room for the Claude session summary line ($summary) in the Agents sidebar
sidebar_max_width = 48
# Claude subscription usage, right of the tabs: 5-hour and 7-day windows
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/scripts/claude-usage.py", interval_seconds = 15, timeout_seconds = 2 },
]

[ui.sound]
# No sounds when agents change state in background workspaces
enabled = false

[theme]
name = "solarized"
auto_switch = false

[keys]
prefix = "ctrl+space"

# iTerm-style Cmd shortcuts (Ghostty unbinds these keys so they reach herdr)
new_tab = ["prefix+c", "ctrl+alt+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+alt+w"]
previous_tab = ["prefix+p", "ctrl+alt+[", "cmd+left"]
next_tab = ["prefix+n", "ctrl+alt+]", "cmd+right"]
previous_workspace = "cmd+up"
next_workspace = "cmd+down"
previous_agent = "cmd+shift+up"
next_agent = "cmd+shift+down"
switch_tab = ["prefix+1..9", "cmd+1..9"]
split_vertical = ["prefix+v", "ctrl+alt+d", "cmd+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d", "cmd+shift+d"]
workspace_picker = ["prefix+w", "cmd+shift+w"]

[[keys.command]]
key = "cmd+o"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "Toggle file explorer / source control sidebar"

[[keys.command]]
key = "cmd+b"
type = "shell"
command = "/Users/jocrau/.config/herdr/scripts/beads-tree.sh"
description = "Toggle full-tab beads view (beads-view: tree, fold, focus, detail)"

[[keys.command]]
key = "cmd+g"
type = "shell"
command = "/Users/jocrau/.config/herdr/scripts/live-git.sh"
description = "Toggle live git view (Source Control that keeps refreshing)"

# Agents sidebar: workspace and the conversation's title (Claude sets the
# terminal title), then the session's own summary line (per pane, from
# claude-summary.py); the agent family only when it isn't claude.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "terminal_title_stripped"],
  [{ token = "$summary", dim = true },
   { token = "agent", dim = true, rules = [{ equals = "claude", hide = true }] }],
]

# Spaces sidebar: name; branch (unless main/master) with ahead/behind; then,
# only when the space needs you, what for: agents waiting, your PR's
# feedback/CI/conflicts/merge (~/.config/herdr/scripts/herdr-spaces.py).
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", dim = true, rules = [{ equals = "main", hide = true }, { equals = "master", hide = true }] }, "git_status"],
  [{ token = "$action", fg = "#b58900" }],
]

[[keys.command]]
key = "cmd+shift+a"
type = "shell"
command = "/Users/jocrau/.config/herdr/scripts/attach-sessions.py"
description = "Give every unattached Claude background session its own workspace"

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "Quick switcher: jump to any agent, tab or workspace (herdr-bar)"

[[keys.command]]
key = "cmd+shift+o"
type = "shell"
command = "/Users/jocrau/.config/herdr/scripts/markdown.sh"
description = "Read Markdown: pick a file in this repo, view it rendered (glow)"
